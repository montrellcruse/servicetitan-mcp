name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run contracts:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run test:wire
      - run: npm run discovery:check
      - run: npm run evaluation:check
      - run: npm run test:packaging
      - run: npm run release:check
      - run: npm pack --dry-run
  ci:
    name: ci
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to succeed
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "Node test matrix concluded with: $MATRIX_RESULT"
            exit 1
          fi
